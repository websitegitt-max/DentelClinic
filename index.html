<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dentel clinic | Dr. krishna | Bengaluru</title>
  <meta name="description" content="Dentel clinic led by Dr. krishna in Hegganahalli, Bengaluru. Advanced dental implants, painless root canals, and teeth whitening." />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            teal: {
              50: '#f0fdfa',
              100: '#ccfbf1',
              600: '#0d9488',
              700: '#0f766e',
              800: '#115e59',
              900: '#134e4a',
            }
          }
        }
      }
    }
  </script>

  <!-- React 18 & Babel in-browser engine -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    h1, h2, h3, h4, .font-serif { font-family: 'Playfair Display', serif; }
  </style>
</head>
<body class="bg-[#FDFCFB] text-slate-800">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo } = React;

    const CLINIC_CONFIG = {
      clinicName: "Dentel clinic",
      tagline: "Advanced Dental Care & Precision Smile Aesthetics",
      phone: "7782962661",
      address: "Siddeshwara Medicals, 73/1, KTG College Rd, Hegganahalli, Bengaluru, Karnataka 560091",
      mapUrl: "https://www.google.com/maps/search/?api=1&query=Siddeshwara+Medicals+73%2F1+KTG+College+Rd+Hegganahalli+Bengaluru+Karnataka+560091",
      doctorName: "Dr. krishna",
      doctorDesignation: "BDS, MDS - Advanced Prosthodontics & Oral Implantology",
      doctorExperience: "15+ Years Clinical Mastery",
      doctorBio: "Dedicated to gentle, ethical, and precision dental healthcare. Specializing in single-sitting microscopic root canals, computer-guided implant restorations, painless ultrasonic scaling, and smile design."
    };

    const WEEKLY_SCHEDULE = [
      { days: "Monday – Friday", hours: "9:00 AM – 10:00 PM", status: "Full Multi-Speciality Practice" },
      { days: "Saturday", hours: "9:00 AM – 10:00 PM", status: "Full Working Hours & Surgeries" },
      { days: "Sunday", hours: "9:00 AM – 9:00 PM", status: "Consultations & Urgent Dental Care" }
    ];

    // 6 Distinct Teeth & Dental Treatment Photos
    const TREATMENT_GALLERY = [
      {
        id: 1,
        title: "Ultrasonic Scaling & Deep Stain Removal",
        category: "Cleaning & Hygiene",
        img: "https://images.unsplash.com/photo-1606811841689-23dfddce3e95?auto=format&fit=crop&w=1000&q=80",
        desc: "Gentle ultrasonic piezo scaling removing deep tartar and plaque while safeguarding natural tooth enamel."
      },
      {
        id: 2,
        title: "Single-Sitting Microscopic Root Canal",
        category: "Endodontics",
        img: "https://images.unsplash.com/photo-1588776814546-1ffcf47267a5?auto=format&fit=crop&w=1000&q=80",
        desc: "High-magnification rotary canal instrumentation relieving acute dental pulp infections painlessly."
      },
      {
        id: 3,
        title: "Invisible Orthodontic Clear Aligners",
        category: "Orthodontics",
        img: "https://images.unsplash.com/photo-1598256989800-fe5f95da9787?auto=format&fit=crop&w=1000&q=80",
        desc: "Custom thermoformed transparent aligners gently correcting crowded teeth and gaps without metal brackets."
      },
      {
        id: 4,
        title: "Laser Teeth Whitening Shade Lift",
        category: "Cosmetics",
        img: "https://images.unsplash.com/photo-1576091160399-112ba8d25d1d?auto=format&fit=crop&w=1000&q=80",
        desc: "Cold-light photo-activation gel lifting up to 8 shades of coffee, tea, and age discoloration safely in 40 minutes."
      },
      {
        id: 5,
        title: "3D Computer-Guided Dental Implants",
        category: "Implantology",
        img: "https://images.unsplash.com/photo-1629909613654-28e377c37b09?auto=format&fit=crop&w=1000&q=80",
        desc: "Permanent titanium fixture osseointegration providing lifelike chewing stability and natural jaw aesthetics."
      },
      {
        id: 6,
        title: "Porcelain Ceramic Veneers & Smile Makeover",
        category: "Aesthetics",
        img: "https://images.unsplash.com/photo-1579684385127-1ef15d508118?auto=format&fit=crop&w=1000&q=80",
        desc: "Ultra-thin custom porcelain laminate veneers correcting chipped surfaces, enamel wear, and shape irregularities."
      }
    ];

    const TREATMENTS = [
      { id: "rct", title: "Single-Visit Painless Root Canal", time: "45 Mins", desc: "Computerized canal mapping and bioceramic hermetic sealing to save natural teeth without discomfort." },
      { id: "implants", title: "Computer-Guided Dental Implants", time: "Single Sitting", desc: "Permanent titanium roots placed using 3D surgical guides for lifetime strength and natural bite." },
      { id: "aligners", title: "Invisible Clear Aligners", time: "6-12 Months", desc: "Discreet transparent trays gently aligning crooked or crowded teeth without uncomfortable metal wires." },
      { id: "whitening", title: "Laser Teeth Whitening", time: "40 Mins", desc: "Professional cold-light whitening lifting deep stains and restoring natural, youthful brightness." },
      { id: "scaling", title: "Ultrasonic Scaling & Polishing", time: "30 Mins", desc: "Painless ultrasonic plaque, calculus, and nicotine stain removal followed by fluoride polishing." },
      { id: "emergency", title: "Emergency Dental Trauma Relief", time: "Immediate", desc: "Rapid treatment for acute toothache, broken cusps, abscess swelling, or dislodged restorations." }
    ];

    function App() {
      const config = CLINIC_CONFIG;
      const [menuOpen, setMenuOpen] = useState(false);
      const [lightbox, setLightbox] = useState(null);
      const [galleryFilter, setGalleryFilter] = useState("All");

      // Appointment form state
      const [appointmentForm, setAppointmentForm] = useState({
        name: "",
        phone: "",
        service: "Single-Visit Painless Root Canal",
        date: "",
        time: "10:00 AM",
        notes: ""
      });
      const [bookedNotice, setBookedNotice] = useState(null);

      const galleryCategories = useMemo(
        () => ["All", ...Array.from(new Set(TREATMENT_GALLERY.map((g) => g.category)))],
        []
      );

      const visibleGallery = useMemo(
        () => galleryFilter === "All" ? TREATMENT_GALLERY : TREATMENT_GALLERY.filter((g) => g.category === galleryFilter),
        [galleryFilter]
      );

      const handleBookAppointment = (e) => {
        e.preventDefault();
        if (!appointmentForm.name || !appointmentForm.phone || !appointmentForm.date) {
          alert("Please fill in patient name, phone number, and preferred appointment date.");
          return;
        }

        const token = "DENT-" + Math.floor(100000 + Math.random() * 900000);
        setBookedNotice({
          token,
          ...appointmentForm
        });

        // Reset form
        setAppointmentForm({
          name: "",
          phone: "",
          service: "Single-Visit Painless Root Canal",
          date: "",
          time: "10:00 AM",
          notes: ""
        });
      };

      return (
        <div className="min-h-screen bg-[#FDFCFB] text-slate-800">
          
          {/* Top Clinical Announcement Bar */}
          <aside className="bg-slate-900 text-slate-300 text-xs py-2.5 px-4 flex justify-between items-center flex-wrap gap-2">
            <div className="flex gap-4 items-center">
              <span className="text-emerald-400 font-semibold flex items-center gap-1.5">
                <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                Open Mon–Sat: 9 AM–10 PM | Sun: 9 AM–9 PM
              </span>
              <span className="hidden md:inline">📍 {config.address}</span>
            </div>
            <div>
              <a href={"tel:" + config.phone} className="text-teal-300 font-bold hover:text-white flex items-center gap-1.5">
                📞 Helpline: {config.phone}
              </a>
            </div>
          </aside>

          {/* Sticky Navigation */}
          <header className="sticky top-0 z-40 border-b border-teal-100 bg-white/95 backdrop-blur-md">
            <div className="mx-auto flex max-w-7xl items-center justify-between px-4 py-4 sm:px-6">
              <a href="#home" className="flex items-center gap-3">
                <div className="grid h-11 w-11 place-items-center rounded-2xl bg-teal-600 text-white font-serif font-black text-xl shadow-md">
                  +
                </div>
                <div>
                  <p className="font-serif text-lg font-bold leading-tight text-teal-900">{config.clinicName}</p>
                  <p className="text-xs text-slate-500">{config.tagline}</p>
                </div>
              </a>

              <nav className="hidden items-center gap-7 lg:flex text-sm font-semibold text-slate-600">
                <a href="#home" className="hover:text-teal-700 transition">Home</a>
                <a href="#treatments" className="hover:text-teal-700 transition">Treatments</a>
                <a href="#gallery" className="hover:text-teal-700 transition">Teeth Gallery</a>
                <a href="#timing" className="hover:text-teal-700 transition">Clinic Timings</a>
                <a href="#doctor" className="hover:text-teal-700 transition">Doctor Profile</a>
                <a href="#appointment" className="hover:text-teal-700 transition">Book Appointment</a>
              </nav>

              <div className="flex items-center gap-3">
                <a
                  href="#appointment"
                  className="rounded-full bg-teal-600 px-5 py-2.5 text-xs sm:text-sm font-bold text-white transition hover:bg-teal-700 shadow-md flex items-center gap-1.5"
                >
                  📅 Book Appointment
                </a>
                <button 
                  className="rounded-full p-2 lg:hidden text-slate-700" 
                  onClick={() => setMenuOpen(!menuOpen)}
                  aria-label="Toggle Navigation"
                >
                  {menuOpen ? "✕" : "☰"}
                </button>
              </div>
            </div>

            {menuOpen && (
              <div className="border-t border-teal-100 bg-white px-4 py-3 lg:hidden text-sm font-semibold text-slate-700 flex flex-col gap-2.5">
                <a href="#home" onClick={() => setMenuOpen(false)}>Home</a>
                <a href="#treatments" onClick={() => setMenuOpen(false)}>Treatments</a>
                <a href="#gallery" onClick={() => setMenuOpen(false)}>Teeth Gallery</a>
                <a href="#timing" onClick={() => setMenuOpen(false)}>Clinic Timings</a>
                <a href="#doctor" onClick={() => setMenuOpen(false)}>Doctor Profile</a>
                <a href="#appointment" onClick={() => setMenuOpen(false)}>Book Appointment</a>
              </div>
            )}
          </header>

          <main>
            {/* Hero Section */}
            <section id="home" className="relative overflow-hidden bg-gradient-to-br from-teal-50 via-white to-white py-16 lg:py-24">
              <div className="mx-auto grid max-w-7xl gap-10 px-4 sm:px-6 lg:grid-cols-2 items-center">
                <div>
                  <span className="inline-flex items-center gap-2 rounded-full bg-teal-100 px-4 py-1.5 text-xs font-bold uppercase tracking-wider text-teal-800">
                    🛡️ {config.doctorExperience}
                  </span>
                  <h1 className="mt-6 font-serif text-4xl font-extrabold leading-tight text-teal-900 sm:text-5xl lg:text-6xl">
                    Gentle, precision dental care you can smile about.
                  </h1>
                  <p className="mt-5 max-w-xl text-base sm:text-lg text-slate-600 leading-relaxed">
                    Welcome to {config.clinicName}. Experience computer-guided dental implants, painless single-sitting root canals, ultrasonic teeth cleaning, and custom smile design in Hegganahalli, Bengaluru.
                  </p>
                  <div className="mt-8 flex flex-wrap gap-4">
                    <a href="#appointment" className="rounded-full bg-teal-600 px-7 py-3.5 font-bold text-white transition hover:bg-teal-700 shadow-lg">
                      📅 Book Your Appointment
                    </a>
                    <a href="#gallery" className="rounded-full border border-teal-600 px-7 py-3.5 font-bold text-teal-700 transition hover:bg-teal-50">
                      View Treatment Gallery
                    </a>
                  </div>

                  <div className="mt-10 grid gap-4 grid-cols-3 max-w-lg">
                    <div className="rounded-2xl border border-teal-100 bg-white p-4 text-center shadow-xs">
                      <p className="text-xl font-bold text-teal-900 font-serif">4.9 ★</p>
                      <p className="text-xs text-slate-500 font-semibold mt-0.5">Patient Rating</p>
                    </div>
                    <div className="rounded-2xl border border-teal-100 bg-white p-4 text-center shadow-xs">
                      <p className="text-xl font-bold text-teal-900 font-serif">100%</p>
                      <p className="text-xs text-slate-500 font-semibold mt-0.5">Sterilization</p>
                    </div>
                    <div className="rounded-2xl border border-teal-100 bg-white p-4 text-center shadow-xs">
                      <p className="text-xl font-bold text-teal-900 font-serif">Zero</p>
                      <p className="text-xs text-slate-500 font-semibold mt-0.5">Fear Protocol</p>
                    </div>
                  </div>
                </div>

                <div className="relative">
                  <img
                    src="https://images.unsplash.com/photo-1629909613654-28e377c37b09?auto=format&fit=crop&w=1000&q=80"
                    alt="Dental operatory chair"
                    className="h-full max-h-[500px] w-full rounded-[2rem] object-cover shadow-2xl border-4 border-white"
                  />
                  <div className="absolute bottom-5 left-5 right-5 rounded-2xl bg-white/95 backdrop-blur-sm p-4 shadow-xl border border-stone-100">
                    <p className="font-bold text-teal-900 font-serif text-lg">{config.doctorName}</p>
                    <p className="text-xs text-slate-600">{config.doctorDesignation}</p>
                  </div>
                </div>
              </div>
            </section>

            {/* Core Treatments Section */}
            <section id="treatments" className="mx-auto max-w-7xl px-4 py-16 sm:px-6 lg:py-20 border-t border-stone-200">
              <div className="mx-auto max-w-2xl text-center">
                <span className="text-xs font-bold uppercase tracking-wider text-teal-700 bg-teal-50 px-3 py-1 rounded-full border border-teal-200">
                  Comprehensive Oral Health
                </span>
                <h2 className="mt-2 font-serif text-3xl font-bold text-teal-900 sm:text-4xl">Specialised Dental Treatments</h2>
                <p className="mt-3 text-slate-600 text-sm">Every procedure is conducted with micro-instruments, gentle anesthesia, and strict autoclave sterilization.</p>
              </div>

              <div className="mt-12 grid gap-6 md:grid-cols-2 lg:grid-cols-3">
                {TREATMENTS.map((t) => (
                  <article key={t.id} className="flex flex-col justify-between rounded-3xl border border-teal-100 bg-white p-6 shadow-xs hover:shadow-xl transition">
                    <div>
                      <div className="flex items-center justify-between">
                        <span className="rounded-full bg-teal-50 px-3 py-1 text-xs font-bold uppercase tracking-wide text-teal-700">
                          {t.time}
                        </span>
                        <span className="text-xs font-semibold text-slate-400">Sterile Suite</span>
                      </div>
                      <h3 className="mt-4 font-serif text-xl font-bold text-teal-900">{t.title}</h3>
                      <p className="mt-3 text-sm leading-relaxed text-slate-600">{t.desc}</p>
                    </div>
                    <a
                      href="#appointment"
                      onClick={() => setAppointmentForm({ ...appointmentForm, service: t.title })}
                      className="mt-6 inline-flex items-center justify-center gap-2 rounded-full bg-teal-50 border border-teal-200 px-5 py-2.5 text-xs font-bold text-teal-800 transition hover:bg-teal-600 hover:text-white"
                    >
                      Book This Procedure →
                    </a>
                  </article>
                ))}
              </div>
            </section>

            {/* Teeth & Treatment Gallery Section (6 High-Quality Photos) */}
            <section id="gallery" className="bg-teal-900 py-16 text-white lg:py-24">
              <div className="mx-auto max-w-7xl px-4 sm:px-6">
                <div className="flex flex-col gap-6 md:flex-row md:items-end md:justify-between">
                  <div>
                    <span className="text-xs font-bold uppercase tracking-wider text-teal-300 bg-white/10 px-3 py-1 rounded-full border border-white/20">
                      Visual Clinical Showcase
                    </span>
                    <h2 className="mt-2 font-serif text-3xl font-bold sm:text-4xl">Teeth & Treatment Gallery</h2>
                    <p className="mt-2 max-w-2xl text-teal-100 text-sm">
                      Inspect our clinical treatments, from precision single-visit root canals and ultrasonic stain removal to aesthetic porcelain veneers and guided implants.
                    </p>
                  </div>
                  <div className="flex flex-wrap gap-2">
                    {galleryCategories.map((category) => (
                      <button
                        key={category}
                        onClick={() => setGalleryFilter(category)}
                        className={"rounded-full px-4 py-2 text-xs font-semibold transition " + (galleryFilter === category ? "bg-white text-teal-900" : "bg-white/10 text-white hover:bg-white/20")}
                      >
                        {category}
                      </button>
                    ))}
                  </div>
                </div>

                <div className="mt-10 grid gap-6 sm:grid-cols-2 lg:grid-cols-3">
                  {visibleGallery.map((item, index) => (
                    <button
                      key={item.id}
                      onClick={() => setLightbox(index)}
                      className="group overflow-hidden rounded-3xl bg-white/5 text-left border border-white/10 shadow-lg"
                    >
                      <div className="relative h-60 w-full overflow-hidden">
                        <img 
                          src={item.img} 
                          alt={item.title} 
                          className="h-full w-full object-cover transition duration-500 group-hover:scale-105" 
                        />
                        <div className="absolute top-3 left-3 bg-slate-900/80 backdrop-blur-sm text-[11px] font-bold text-teal-300 px-3 py-1 rounded-full">
                          {item.category}
                        </div>
                      </div>
                      <div className="p-5">
                        <h3 className="font-serif text-lg font-bold text-white">{item.title}</h3>
                        <p className="mt-2 text-xs text-teal-100/80 leading-relaxed">{item.desc}</p>
                        <span className="mt-3 inline-block text-[11px] font-semibold text-teal-300">
                          Click to enlarge photo 🔍
                        </span>
                      </div>
                    </button>
                  ))}
                </div>
              </div>
            </section>

            {/* Weekly Timings & Schedule Section */}
            <section id="timing" className="py-16 sm:py-20 bg-stone-50 border-b border-stone-200">
              <div className="max-w-5xl mx-auto px-4 sm:px-6">
                <div className="text-center max-w-2xl mx-auto mb-12">
                  <span className="text-xs font-bold uppercase tracking-wider text-teal-700 bg-teal-100 px-3 py-1 rounded-full border border-teal-200">
                    Clinic Working Hours
                  </span>
                  <h2 className="mt-2 font-serif text-3xl font-bold text-teal-900">Weekly Open & Close Schedule</h2>
                  <p className="mt-2 text-sm text-slate-600">Open 7 days a week for scheduled consultations, post-op reviews, and immediate toothache relief.</p>
                </div>

                <div className="grid md:grid-cols-3 gap-6">
                  {WEEKLY_SCHEDULE.map((item, idx) => (
                    <div key={idx} className="rounded-3xl border border-teal-100 bg-white p-6 shadow-sm hover:shadow-md transition">
                      <div className="inline-flex items-center gap-2 text-xs font-bold text-emerald-700 bg-emerald-50 px-3 py-1 rounded-full mb-3">
                        <span className="w-2 h-2 rounded-full bg-emerald-500"></span> Open
                      </div>
                      <h3 className="font-serif text-xl font-bold text-slate-900">{item.days}</h3>
                      <p className="mt-2 text-lg font-extrabold text-teal-700">{item.hours}</p>
                      <p className="mt-3 text-xs text-slate-500 leading-relaxed pt-3 border-t border-stone-100">{item.status}</p>
                    </div>
                  ))}
                </div>

                <div className="mt-8 rounded-2xl bg-teal-50 border border-teal-200 p-4 text-center text-xs text-teal-900">
                  ⚠️ <strong>Emergency Toothache or Fracture?</strong> Call <a href={"tel:" + config.phone} className="underline font-bold">{config.phone}</a> immediately for priority chair reservation.
                </div>
              </div>
            </section>

            {/* Doctor Profile */}
            <section id="doctor" className="mx-auto max-w-7xl px-4 py-16 sm:px-6 lg:py-24">
              <div className="grid items-center gap-10 lg:grid-cols-2">
                <img
                  src="https://images.unsplash.com/photo-1598256989800-fe5f95da9787?auto=format&fit=crop&w=1000&q=80"
                  alt="Doctor consultation suite"
                  className="h-96 w-full rounded-[2rem] object-cover shadow-xl border-4 border-white"
                />
                <div>
                  <span className="text-xs font-bold uppercase tracking-wider text-teal-700 bg-teal-50 px-3 py-1 rounded-full border border-teal-200">
                    Lead Clinical Specialist
                  </span>
                  <h2 className="mt-2 font-serif text-3xl font-bold text-teal-900 sm:text-4xl">Meet {config.doctorName}</h2>
                  <p className="mt-2 font-semibold text-teal-700">{config.doctorDesignation}</p>
                  <p className="mt-4 text-slate-600 text-sm sm:text-base leading-relaxed">{config.doctorBio}</p>
                  
                  <div className="mt-8 grid gap-4 sm:grid-cols-2">
                    <div className="rounded-2xl border border-teal-100 bg-white p-5 shadow-xs">
                      <p className="font-bold text-teal-900">Zero-Fear Dentistry</p>
                      <p className="mt-1 text-xs text-slate-600">Gentle anesthesia protocols, step-by-step guidance, and complete anxiety relief.</p>
                    </div>
                    <div className="rounded-2xl border border-teal-100 bg-white p-5 shadow-xs">
                      <p className="font-bold text-teal-900">Computer-Guided Accuracy</p>
                      <p className="mt-1 text-xs text-slate-600">Digital smile simulation, rotary apex locators, and precise tooth restorations.</p>
                    </div>
                  </div>
                </div>
              </div>
            </section>

            {/* Direct Online Appointment Booking Engine (Replaces WhatsApp Link) */}
            <section id="appointment" className="py-16 sm:py-24 bg-stone-50 border-t border-stone-200">
              <div className="max-w-3xl mx-auto px-4 sm:px-6">
                <div className="rounded-3xl bg-white p-8 sm:p-12 shadow-xl border border-teal-100">
                  <div className="text-center max-w-xl mx-auto mb-8">
                    <span className="text-xs font-bold uppercase tracking-wider text-teal-700 bg-teal-50 px-3 py-1 rounded-full border border-teal-200">
                      Online Reservation
                    </span>
                    <h2 className="mt-2 font-serif text-3xl font-bold text-teal-900">Book Your Dental Visit</h2>
                    <p className="mt-2 text-xs sm:text-sm text-slate-500">
                      Choose your preferred date, slot, and procedure. Our desk immediately locks your appointment with {config.doctorName}.
                    </p>
                  </div>

                  {bookedNotice && (
                    <div className="mb-8 rounded-2xl bg-emerald-50 border border-emerald-200 p-5 text-emerald-900">
                      <div className="flex items-center justify-between mb-2">
                        <span className="text-xs font-mono font-bold bg-emerald-200 text-emerald-900 px-2.5 py-0.5 rounded">
                          Token: {bookedNotice.token}
                        </span>
                        <span className="text-xs font-bold text-emerald-700">✓ Booking Confirmed</span>
                      </div>
                      <p className="text-sm font-bold">Appointment scheduled for {bookedNotice.name}!</p>
                      <p className="text-xs text-emerald-800 mt-1">
                        Procedure: <strong>{bookedNotice.service}</strong> on <strong>{bookedNotice.date} at {bookedNotice.time}</strong>.
                      </p>
                      <p className="text-[11px] text-emerald-700 mt-2">
                        A confirmation SMS has been logged for contact: {bookedNotice.phone}.
                      </p>
                    </div>
                  )}

                  <form onSubmit={handleBookAppointment} className="grid grid-cols-1 sm:grid-cols-2 gap-5 text-xs">
                    <div>
                      <label className="block font-bold text-slate-700 mb-1 uppercase tracking-wide">
                        Patient Full Name *
                      </label>
                      <input 
                        type="text" 
                        required 
                        placeholder="e.g. Ramesh Kumar"
                        value={appointmentForm.name}
                        onChange={(e) => setAppointmentForm({ ...appointmentForm, name: e.target.value })}
                        className="w-full p-3 rounded-xl border border-stone-300 text-sm bg-stone-50/50 focus:outline-none focus:ring-2 focus:ring-teal-600"
                      />
                    </div>

                    <div>
                      <label className="block font-bold text-slate-700 mb-1 uppercase tracking-wide">
                        Contact Phone Number *
                      </label>
                      <input 
                        type="tel" 
                        required 
                        placeholder="e.g. 7782962661"
                        value={appointmentForm.phone}
                        onChange={(e) => setAppointmentForm({ ...appointmentForm, phone: e.target.value })}
                        className="w-full p-3 rounded-xl border border-stone-300 text-sm bg-stone-50/50 focus:outline-none focus:ring-2 focus:ring-teal-600"
                      />
                    </div>

                    <div className="sm:col-span-2">
                      <label className="block font-bold text-slate-700 mb-1 uppercase tracking-wide">
                        Treatment / Concern
                      </label>
                      <select 
                        value={appointmentForm.service}
                        onChange={(e) => setAppointmentForm({ ...appointmentForm, service: e.target.value })}
                        className="w-full p-3 rounded-xl border border-stone-300 text-sm bg-stone-50/50 focus:outline-none focus:ring-2 focus:ring-teal-600"
                      >
                        {TREATMENTS.map((t) => (
                          <option key={t.id} value={t.title}>{t.title}</option>
                        ))}
                        <option value="General Checkup & Teeth Examination">General Checkup & Teeth Examination</option>
                      </select>
                    </div>

                    <div>
                      <label className="block font-bold text-slate-700 mb-1 uppercase tracking-wide">
                        Preferred Date *
                      </label>
                      <input 
                        type="date" 
                        required 
                        value={appointmentForm.date}
                        onChange={(e) => setAppointmentForm({ ...appointmentForm, date: e.target.value })}
                        className="w-full p-3 rounded-xl border border-stone-300 text-sm bg-stone-50/50 focus:outline-none focus:ring-2 focus:ring-teal-600"
                      />
                    </div>

                    <div>
                      <label className="block font-bold text-slate-700 mb-1 uppercase tracking-wide">
                        Preferred Time Slot
                      </label>
                      <select 
                        value={appointmentForm.time}
                        onChange={(e) => setAppointmentForm({ ...appointmentForm, time: e.target.value })}
                        className="w-full p-3 rounded-xl border border-stone-300 text-sm bg-stone-50/50 focus:outline-none focus:ring-2 focus:ring-teal-600"
                      >
                        <option>09:30 AM</option>
                        <option>11:00 AM</option>
                        <option>01:30 PM</option>
                        <option>04:00 PM</option>
                        <option>06:30 PM</option>
                        <option>08:30 PM</option>
                      </select>
                    </div>

                    <div className="sm:col-span-2">
                      <label className="block font-bold text-slate-700 mb-1 uppercase tracking-wide">
                        Symptoms or Requests (Optional)
                      </label>
                      <textarea 
                        rows={2}
                        placeholder="e.g. Sensitivity to cold water on upper right molar."
                        value={appointmentForm.notes}
                        onChange={(e) => setAppointmentForm({ ...appointmentForm, notes: e.target.value })}
                        className="w-full p-3 rounded-xl border border-stone-300 text-sm bg-stone-50/50 focus:outline-none focus:ring-2 focus:ring-teal-600"
                      />
                    </div>

                    <div className="sm:col-span-2 pt-2">
                      <button 
                        type="submit" 
                        className="w-full py-4 rounded-xl bg-teal-600 hover:bg-teal-700 text-white font-bold text-sm shadow-md transition hover:shadow-lg"
                      >
                        Confirm Dental Appointment
                      </button>
                    </div>
                  </form>
                </div>
              </div>
            </section>

            {/* Contact & Direct Google Maps Link Section */}
            <section id="contact" className="border-t border-teal-100 bg-white py-16 lg:py-24">
              <div className="mx-auto max-w-7xl px-4 sm:px-6">
                <div className="text-center max-w-2xl mx-auto mb-12">
                  <span className="text-xs font-bold uppercase tracking-wider text-teal-700 bg-teal-50 px-3 py-1 rounded-full border border-teal-200">
                    Location & Directions
                  </span>
                  <h2 className="mt-2 font-serif text-3xl font-bold text-teal-900 sm:text-4xl">Visit Dentel clinic</h2>
                  <p className="mt-2 text-slate-600 text-sm">Located on KTG College Road, Hegganahalli, Bengaluru.</p>
                </div>

                <div className="grid gap-8 lg:grid-cols-3">
                  <div className="rounded-3xl border border-teal-100 bg-teal-50/40 p-6 flex flex-col justify-between">
                    <div>
                      <span className="text-3xl">📞</span>
                      <h3 className="mt-3 font-serif text-xl font-bold text-teal-900">Direct Helpline</h3>
                      <p className="mt-2 text-slate-600 text-sm">Call for appointment confirmations and emergencies:</p>
                      <p className="mt-2 text-lg font-bold text-teal-800">{config.phone}</p>
                    </div>
                    <a href={"tel:" + config.phone} className="mt-5 inline-block text-xs font-bold text-teal-700 hover:underline">
                      Call Desk Now →
                    </a>
                  </div>

                  <div className="rounded-3xl border border-teal-100 bg-teal-50/40 p-6 flex flex-col justify-between">
                    <div>
                      <span className="text-3xl">📍</span>
                      <h3 className="mt-3 font-serif text-xl font-bold text-teal-900">Physical Address</h3>
                      <p className="mt-2 text-slate-600 text-sm leading-relaxed">{config.address}</p>
                    </div>
                    <a 
                      href={config.mapUrl} 
                      target="_blank" 
                      rel="noopener noreferrer" 
                      className="mt-5 inline-flex items-center gap-2 rounded-xl bg-teal-600 px-4 py-2.5 text-xs font-bold text-white hover:bg-teal-700 transition shadow-sm w-fit"
                    >
                      🗺️ Open in Google Maps
                    </a>
                  </div>

                  <div className="rounded-3xl border border-teal-100 bg-teal-50/40 p-6 flex flex-col justify-between">
                    <div>
                      <span className="text-3xl">🕒</span>
                      <h3 className="mt-3 font-serif text-xl font-bold text-teal-900">Weekly Timings</h3>
                      <div className="mt-2 space-y-1 text-xs text-slate-600">
                        <p><strong>Mon – Sat:</strong> 9:00 AM – 10:00 PM</p>
                        <p><strong>Sunday:</strong> 9:00 AM – 9:00 PM</p>
                      </div>
                    </div>
                    <a href="#timing" className="mt-5 inline-block text-xs font-bold text-teal-700 hover:underline">
                      View full schedule details →
                    </a>
                  </div>
                </div>

                {/* Direct Google Maps Action Card */}
                <div className="mt-12 rounded-3xl bg-slate-900 text-white p-8 sm:p-10 flex flex-col md:flex-row items-center justify-between gap-6">
                  <div>
                    <h3 className="font-serif text-2xl font-bold text-white">Need Turn-by-Turn GPS Directions?</h3>
                    <p className="mt-1 text-sm text-slate-300 max-w-xl">
                      Click below to launch Google Maps directly for real-time traffic and routing to Siddeshwara Medicals, KTG College Rd, Hegganahalli.
                    </p>
                  </div>
                  <a
                    href={config.mapUrl}
                    target="_blank"
                    rel="noopener noreferrer"
                    className="shrink-0 rounded-full bg-teal-500 hover:bg-teal-400 text-slate-950 font-bold px-7 py-3.5 text-sm transition shadow-lg flex items-center gap-2"
                  >
                    <span>📍 Get Google Maps Route</span>
                  </a>
                </div>
              </div>
            </section>
          </main>

          {/* Footer */}
          <footer className="bg-teal-900 py-10 text-center text-teal-100 text-xs border-t border-teal-800">
            <p className="font-bold text-base text-white font-serif">{config.clinicName}</p>
            <p className="mt-2 max-w-md mx-auto">{config.address}</p>
            <p className="mt-2">Helpline: {config.phone} • Mon–Sat: 9 AM–10 PM | Sun: 9 AM–9 PM</p>
            <p className="mt-6 text-teal-400">© 2026 {config.clinicName}. All rights reserved.</p>
          </footer>

          {/* Photo Gallery Lightbox Modal */}
          {lightbox !== null && visibleGallery[lightbox] && (
            <div 
              className="fixed inset-0 z-50 grid place-items-center bg-black/85 p-4 backdrop-blur-xs" 
              onClick={() => setLightbox(null)}
            >
              <div 
                className="relative max-h-[90vh] w-full max-w-4xl overflow-hidden rounded-3xl bg-white shadow-2xl" 
                onClick={(e) => e.stopPropagation()}
              >
                <img 
                  src={visibleGallery[lightbox].img} 
                  alt={visibleGallery[lightbox].title} 
                  className="max-h-[65vh] w-full object-cover" 
                />
                <div className="p-6">
                  <p className="text-xs font-bold uppercase tracking-wide text-teal-700">{visibleGallery[lightbox].category}</p>
                  <h3 className="mt-1 font-serif text-2xl font-bold text-teal-900">{visibleGallery[lightbox].title}</h3>
                  <p className="mt-2 text-xs sm:text-sm text-slate-600">{visibleGallery[lightbox].desc}</p>
                </div>
                <button
                  onClick={() => setLightbox((lightbox - 1 + visibleGallery.length) % visibleGallery.length)}
                  className="absolute left-3 top-1/2 -translate-y-1/2 rounded-full bg-white/90 p-2.5 font-bold shadow hover:bg-white"
                >
                  ◀
                </button>
                <button
                  onClick={() => setLightbox((lightbox + 1) % visibleGallery.length)}
                  className="absolute right-3 top-1/2 -translate-y-1/2 rounded-full bg-white/90 p-2.5 font-bold shadow hover:bg-white"
                >
                  ▶
                </button>
                <button 
                  onClick={() => setLightbox(null)} 
                  className="absolute right-4 top-4 rounded-full bg-white/90 w-8 h-8 flex items-center justify-center font-bold shadow hover:bg-white"
                >
                  ✕
                </button>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
