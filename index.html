<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dentel clinic | Dr. krishna</title>
  <meta name="description" content="Advanced dental care and smile aesthetics by Dr. krishna in Hegganahalli, Bengaluru." />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            teal: {
              50: '#f0fdfa',
              100: '#ccfbf1',
              600: '#0d9488',
              700: '#0f766e',
              800: '#115e59',
              900: '#134e4a',
            }
          }
        }
      }
    }
  </script>

  <!-- React 18 & Babel in-browser runtime -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    h1, h2, h3, h4, .font-serif { font-family: 'Playfair Display', serif; }
  </style>
</head>
<body class="bg-[#FDFCFB] text-slate-800">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const CLINIC_CONFIG = {
      clinicName: "Dentel clinic",
      tagline: "Advanced Dental Care & Precision Smile Aesthetics",
      phone: "7782962661",
      whatsapp: "917782962661",
      address: "Siddeshwara Medicals, 73/1, KTG College Rd, Hegganahalli, Bengaluru, Karnataka 560091",
      timing: "Mon - Sun: 9:00 AM - 10:00 PM",
      doctorName: "Dr. krishna",
      doctorDesignation: "BDS, MDS - Advanced Prosthodontics & Oral Implantology",
      doctorExperience: "15+ Years Clinical Mastery",
      doctorBio: "Committed to gentle, precision dental care with zero-fear protocols. Specialized in painless single-visit root canals, computer-guided implant restorations, and microscopic aesthetics."
    };

    const CLINIC_GALLERY = [
      { id: 1, title: "Ergonomic Operatory Suite", category: "Operatory", img: "https://images.unsplash.com/photo-1629909613654-28e377c37b09?auto=format&fit=crop&w=1000&q=80", desc: "Computerized dental chair equipped with intraoral camera, ultrasonic scaler, and ambient lighting." },
      { id: 2, title: "Diagnostic 3D CBCT Center", category: "3D Imaging", img: "https://images.unsplash.com/photo-1588776814546-1ffcf47267a5?auto=format&fit=crop&w=1000&q=80", desc: "Ultra-low-radiation panoramic digital imaging enabling sub-millimeter diagnostic precision." },
      { id: 3, title: "Class-B Autoclave Sterilization Bay", category: "Sterilization", img: "https://images.unsplash.com/photo-1579684385127-1ef15d508118?auto=format&fit=crop&w=1000&q=80", desc: "Hospital-grade vacuum sterilization protocols with individually sealed single-use patient hygiene kits." },
      { id: 4, title: "Aesthetic Treatment Lounge", category: "Lounge", img: "https://images.unsplash.com/photo-1598256989800-fe5f95da9787?auto=format&fit=crop&w=1000&q=80", desc: "Tranquil consultation rooms designed for relaxed case discussions and digital smile simulations." },
      { id: 5, title: "Precision Micro-Surgical Dental Tools", category: "Instruments", img: "https://images.unsplash.com/photo-1606811841689-23dfddce3e95?auto=format&fit=crop&w=1000&q=80", desc: "German engineered micro-endodontic rotary systems ensuring over 99% pain-free root canals." },
      { id: 6, title: "Cosmetic Veneers & Smile Studio", category: "Aesthetics", img: "https://images.unsplash.com/photo-1576091160399-112ba8d25d1d?auto=format&fit=crop&w=1000&q=80", desc: "Dedicated chairside shade-matching station for natural, glowing smile makeovers." }
    ];

    const TREATMENTS = [
      { id: "rct", title: "Single-Visit Painless Root Canal", category: "Endodontics", time: "45 Mins", desc: "Microscopic rotary canal cleaning and bioceramic hermetic sealing to preserve natural teeth with zero discomfort." },
      { id: "implants", title: "Computer-Guided Dental Implants", category: "Implantology", time: "Single Sitting", desc: "Permanent titanium and zirconia roots anchored with 3D CBCT surgical guides for natural bite and lifelong stability." },
      { id: "aligners", title: "Invisible Clear Aligners", category: "Orthodontics", time: "6-12 Months", desc: "Virtually invisible, custom thermoformed aligners that align your bite smoothly without metal brackets." },
      { id: "whitening", title: "Laser Teeth Whitening", category: "Cosmetics", time: "40 Mins", desc: "Philips Zoom medical cold-light whitening lifting years of deep tea, coffee, and age stains safely." },
      { id: "pediatric", title: "Pediatric Gentle Dental Care", category: "Children", time: "30 Mins", desc: "Child-friendly cavity protection, pit & fissure sealing, and gentle habit-breaking counseling for kids." },
      { id: "emergency", title: "Emergency Toothache Relief", category: "Urgent Care", time: "Priority Immediate", desc: "Immediate relief for severe pulp inflammation, broken cusps, knocked-out teeth, or acute jaw swelling." }
    ];

    const STORAGE_KEY = "dentel-clinic-appointments";

    function App() {
      const config = CLINIC_CONFIG;
      const [menuOpen, setMenuOpen] = useState(false);
      const [drawerOpen, setDrawerOpen] = useState(false);
      const [lightbox, setLightbox] = useState(null);
      const [galleryFilter, setGalleryFilter] = useState("All");
      const [sliderPos, setSliderPos] = useState(50);

      const [appointments, setAppointments] = useState(() => {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          return saved ? JSON.parse(saved) : [{
            id: "APT-892104",
            title: "Single-Visit Painless Root Canal",
            category: "Endodontics",
            time: "11:00 AM",
            bookedAt: new Date().toISOString()
          }];
        } catch {
          return [];
        }
      });

      useEffect(() => {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(appointments));
        } catch (e) {
          console.error(e);
        }
      }, [appointments]);

      const downloadSelf = () => {
        const htmlContent = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
        const blob = new Blob([htmlContent], { type: "text/html;charset=utf-8" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "index.html";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      };

      const galleryCategories = useMemo(
        () => ["All", ...Array.from(new Set(CLINIC_GALLERY.map((g) => g.category)))],
        []
      );

      const visibleGallery = useMemo(
        () => galleryFilter === "All" ? CLINIC_GALLERY : CLINIC_GALLERY.filter((g) => g.category === galleryFilter),
        [galleryFilter]
      );

      const whatsappLink = (msg) =>
        "https://wa.me/" + config.whatsapp + "?text=" + encodeURIComponent(msg);

      const addAppointment = (treatment) => {
        setAppointments((prev) => [
          ...prev,
          {
            id: treatment.id + "-" + Date.now(),
            treatmentId: treatment.id,
            title: treatment.title,
            category: treatment.category,
            time: treatment.time,
            bookedAt: new Date().toISOString()
          }
        ]);
        setDrawerOpen(true);
      };

      const cancelAppointment = (appointment) => {
        const message = "Hello " + config.clinicName + ", I would like to cancel my appointment for \"" + appointment.title + "\". Booked on " + new Date(appointment.bookedAt).toLocaleString() + ".";
        window.open(whatsappLink(message), "_blank");
        setAppointments((prev) => prev.filter((item) => item.id !== appointment.id));
      };

      return (
        <div className="min-h-screen bg-[#FDFCFB] text-slate-800">
          
          {/* Top Quick Info Bar with Direct Download Option */}
          <aside className="bg-slate-900 text-slate-300 text-xs py-2.5 px-4 flex justify-between items-center flex-wrap gap-2">
            <div className="flex gap-4 items-center">
              <span className="text-emerald-400 font-semibold">● Open Daily: {config.timing}</span>
              <span className="hidden md:inline">📍 {config.address}</span>
            </div>
            <div className="flex gap-3 items-center">
              <a href={"tel:" + config.phone} className="hover:text-white font-semibold">
                📞 {config.phone}
              </a>
              <button 
                onClick={downloadSelf}
                className="bg-teal-700 hover:bg-teal-600 text-white font-bold px-3 py-1 rounded-lg text-[11px] transition shadow-xs flex items-center gap-1"
                title="Download this single index.html file to your computer"
              >
                💾 Download index.html
              </button>
            </div>
          </aside>

          {/* Sticky Header */}
          <header className="sticky top-0 z-40 border-b border-teal-100 bg-white/95 backdrop-blur-md">
            <div className="mx-auto flex max-w-7xl items-center justify-between px-4 py-4 sm:px-6">
              <a href="#home" className="flex items-center gap-3">
                <div className="grid h-11 w-11 place-items-center rounded-2xl bg-teal-600 text-white font-serif font-black text-xl shadow-md">
                  +
                </div>
                <div>
                  <p className="font-serif text-lg font-bold leading-tight text-teal-900">{config.clinicName}</p>
                  <p className="text-xs text-slate-500">{config.tagline}</p>
                </div>
              </a>

              <nav className="hidden items-center gap-7 lg:flex text-sm font-semibold text-slate-600">
                <a href="#home" className="hover:text-teal-700">Home</a>
                <a href="#treatments" className="hover:text-teal-700">Treatments</a>
                <a href="#gallery" className="hover:text-teal-700">Facilities</a>
                <a href="#transformation" className="hover:text-teal-700">Results</a>
                <a href="#doctor" className="hover:text-teal-700">Doctor</a>
                <a href="#contact" className="hover:text-teal-700">Contact</a>
              </nav>

              <div className="flex items-center gap-3">
                <button
                  onClick={() => setDrawerOpen(true)}
                  className="relative rounded-full bg-teal-600 px-4 py-2 text-sm font-bold text-white transition hover:bg-teal-700 flex items-center gap-2"
                >
                  <span>📅 Appointments</span>
                  {appointments.length > 0 && (
                    <span className="grid h-5 w-5 place-items-center rounded-full bg-rose-500 text-[11px] font-bold text-white">
                      {appointments.length}
                    </span>
                  )}
                </button>
                <button className="rounded-full p-2 lg:hidden text-slate-700" onClick={() => setMenuOpen(!menuOpen)}>
                  {menuOpen ? "✕" : "☰"}
                </button>
              </div>
            </div>

            {menuOpen && (
              <div className="border-t border-teal-100 bg-white px-4 py-3 lg:hidden text-sm font-semibold text-slate-700 flex flex-col gap-2">
                <a href="#home" onClick={() => setMenuOpen(false)}>Home</a>
                <a href="#treatments" onClick={() => setMenuOpen(false)}>Treatments</a>
                <a href="#gallery" onClick={() => setMenuOpen(false)}>Facilities</a>
                <a href="#transformation" onClick={() => setMenuOpen(false)}>Results</a>
                <a href="#doctor" onClick={() => setMenuOpen(false)}>Doctor</a>
                <a href="#contact" onClick={() => setMenuOpen(false)}>Contact</a>
              </div>
            )}
          </header>

          <main>
            {/* Hero Section */}
            <section id="home" className="relative overflow-hidden bg-gradient-to-br from-teal-50 via-white to-white py-16 lg:py-24">
              <div className="mx-auto grid max-w-7xl gap-10 px-4 sm:px-6 lg:grid-cols-2 items-center">
                <div>
                  <span className="inline-flex items-center gap-2 rounded-full bg-teal-100 px-4 py-1.5 text-xs font-bold uppercase tracking-wider text-teal-800">
                    🛡️ {config.doctorExperience}
                  </span>
                  <h1 className="mt-6 font-serif text-4xl font-extrabold leading-tight text-teal-900 sm:text-5xl lg:text-6xl">
                    Advanced dental care with a gentle, precision-first approach
                  </h1>
                  <p className="mt-5 max-w-xl text-base sm:text-lg text-slate-600 leading-relaxed">
                    Painless single-visit root canals, computer-guided implants, clear aligners, and cosmetic smile transformations in Hegganahalli, Bengaluru.
                  </p>
                  <div className="mt-8 flex flex-wrap gap-3">
                    <a href="#treatments" className="rounded-full bg-teal-600 px-6 py-3 font-bold text-white transition hover:bg-teal-700 shadow-md">
                      Explore Treatments
                    </a>
                    <a
                      href={whatsappLink("Hello " + config.clinicName + ", I would like to book a dental consultation.")}
                      target="_blank"
                      rel="noreferrer"
                      className="inline-flex items-center gap-2 rounded-full border border-teal-600 px-6 py-3 font-bold text-teal-700 transition hover:bg-teal-50"
                    >
                      💬 WhatsApp Booking
                    </a>
                  </div>
                  <div className="mt-10 grid gap-4 grid-cols-3">
                    <div className="rounded-2xl border border-teal-100 bg-white p-3 sm:p-4 text-center">
                      <p className="text-xl font-bold text-teal-900 font-serif">4.9 ★</p>
                      <p className="text-xs text-slate-500 font-semibold mt-0.5">Patient Rating</p>
                    </div>
                    <div className="rounded-2xl border border-teal-100 bg-white p-3 sm:p-4 text-center">
                      <p className="text-xl font-bold text-teal-900 font-serif">100%</p>
                      <p className="text-xs text-slate-500 font-semibold mt-0.5">Sterilization</p>
                    </div>
                    <div className="rounded-2xl border border-teal-100 bg-white p-3 sm:p-4 text-center">
                      <p className="text-xl font-bold text-teal-900 font-serif">3D</p>
                      <p className="text-xs text-slate-500 font-semibold mt-0.5">Smile Design</p>
                    </div>
                  </div>
                </div>

                <div className="relative">
                  <img
                    src={CLINIC_GALLERY[0].img}
                    alt="Modern dental operatory"
                    className="h-full max-h-[500px] w-full rounded-[2rem] object-cover shadow-2xl border-4 border-white"
                  />
                  <div className="absolute bottom-5 left-5 right-5 rounded-2xl bg-white/95 backdrop-blur-sm p-4 shadow-xl">
                    <p className="font-bold text-teal-900 font-serif">{config.doctorName}</p>
                    <p className="text-xs text-slate-600">{config.doctorDesignation}</p>
                  </div>
                </div>
              </div>
            </section>

            {/* Treatments Section */}
            <section id="treatments" className="mx-auto max-w-7xl px-4 py-16 sm:px-6 lg:py-24">
              <div className="mx-auto max-w-2xl text-center">
                <span className="text-xs font-bold uppercase tracking-wider text-teal-700 bg-teal-50 px-3 py-1 rounded-full border border-teal-200">
                  Comprehensive Services
                </span>
                <h2 className="mt-2 font-serif text-3xl font-bold text-teal-900 sm:text-4xl">Specialised Dental Treatments</h2>
                <p className="mt-3 text-slate-600 text-sm">Choose a treatment to add it to your appointment bag. Our team confirms your preferred slot directly.</p>
              </div>

              <div className="mt-12 grid gap-6 md:grid-cols-2 lg:grid-cols-3">
                {TREATMENTS.map((treatment) => (
                  <article key={treatment.id} className="flex flex-col justify-between rounded-3xl border border-teal-100 bg-white p-6 shadow-xs hover:shadow-xl transition">
                    <div>
                      <div className="flex items-center justify-between">
                        <span className="rounded-full bg-teal-50 px-3 py-1 text-xs font-bold uppercase tracking-wide text-teal-700">
                          {treatment.category}
                        </span>
                        <span className="text-xs font-semibold text-slate-500">⏱ {treatment.time}</span>
                      </div>
                      <h3 className="mt-4 font-serif text-xl font-bold text-teal-900">{treatment.title}</h3>
                      <p className="mt-3 text-sm leading-relaxed text-slate-600">{treatment.desc}</p>
                    </div>
                    <button
                      onClick={() => addAppointment(treatment)}
                      className="mt-6 inline-flex items-center justify-center gap-2 rounded-full bg-teal-600 px-5 py-3 text-sm font-bold text-white transition hover:bg-teal-700"
                    >
                      + Add to Appointment Bag
                    </button>
                  </article>
                ))}
              </div>
            </section>

            {/* Facilities Gallery */}
            <section id="gallery" className="bg-teal-900 py-16 text-white lg:py-24">
              <div className="mx-auto max-w-7xl px-4 sm:px-6">
                <div className="flex flex-col gap-6 md:flex-row md:items-end md:justify-between">
                  <div>
                    <h2 className="font-serif text-3xl font-bold sm:text-4xl">Clinic Facilities</h2>
                    <p className="mt-2 max-w-2xl text-teal-100 text-sm">Advanced diagnostic, sterilization, and comfort infrastructure designed for safe and relaxed dental care.</p>
                  </div>
                  <div className="flex flex-wrap gap-2">
                    {galleryCategories.map((category) => (
                      <button
                        key={category}
                        onClick={() => setGalleryFilter(category)}
                        className={"rounded-full px-4 py-2 text-xs font-semibold transition " + (galleryFilter === category ? "bg-white text-teal-900" : "bg-white/10 text-white hover:bg-white/20")}
                      >
                        {category}
                      </button>
                    ))}
                  </div>
                </div>

                <div className="mt-10 grid gap-6 sm:grid-cols-2 lg:grid-cols-3">
                  {visibleGallery.map((item, index) => (
                    <button
                      key={item.id}
                      onClick={() => setLightbox(index)}
                      className="group overflow-hidden rounded-3xl bg-white/5 text-left border border-white/10"
                    >
                      <img src={item.img} alt={item.title} className="h-56 w-full object-cover transition duration-500 group-hover:scale-105" />
                      <div className="p-5">
                        <p className="text-xs font-bold uppercase tracking-wide text-teal-200">{item.category}</p>
                        <h3 className="mt-1 font-serif text-lg font-bold">{item.title}</h3>
                        <p className="mt-2 text-xs text-teal-100/80 leading-relaxed">{item.desc}</p>
                      </div>
                    </button>
                  ))}
                </div>
              </div>
            </section>

            {/* Before & After Comparison Slider */}
            <section id="transformation" className="py-16 sm:py-24 bg-stone-50 border-b border-stone-200">
              <div className="max-w-4xl mx-auto px-4 text-center">
                <span className="text-xs font-bold uppercase tracking-wider text-teal-700 bg-teal-100 px-3 py-1 rounded-full border border-teal-200">
                  Clinical Results
                </span>
                <h2 className="mt-2 font-serif text-3xl sm:text-4xl font-bold text-teal-900">Before & After Smile Transformation</h2>
                <p className="mt-2 text-slate-600 text-sm mb-8">Drag the interactive slider horizontally to inspect teeth restoration and whitening outcomes.</p>
                
                <div className="relative rounded-3xl overflow-hidden shadow-2xl border-4 border-white aspect-[16/9] select-none">
                  <img src="https://images.unsplash.com/photo-1588776814546-1ffcf47267a5?auto=format&fit=crop&w=1200&q=80" alt="After treatment" className="absolute inset-0 w-full h-full object-cover" />
                  <div className="absolute top-4 right-4 bg-teal-800 text-white text-xs font-bold px-3 py-1 rounded-full shadow">AFTER</div>
                  
                  <div className="absolute inset-0 overflow-hidden" style={{ width: sliderPos + "%" }}>
                    <img src="https://images.unsplash.com/photo-1598256989800-fe5f95da9787?auto=format&fit=crop&w=1200&q=80" alt="Before treatment" className="absolute inset-0 w-full h-full object-cover max-w-none" style={{ width: "100%", height: "100%" }} />
                    <div className="absolute top-4 left-4 bg-slate-900 text-white text-xs font-bold px-3 py-1 rounded-full shadow">BEFORE</div>
                  </div>

                  <div className="absolute top-0 bottom-0 w-1 bg-white cursor-ew-resize" style={{ left: sliderPos + "%" }}>
                    <div className="absolute top-1/2 -left-4 -translate-y-1/2 w-8 h-8 rounded-full bg-white text-teal-800 shadow-md flex items-center justify-center text-xs font-bold border border-teal-600">⇄</div>
                  </div>
                  <input 
                    type="range" 
                    min="0" 
                    max="100" 
                    value={sliderPos} 
                    onChange={(e) => setSliderPos(Number(e.target.value))} 
                    className="absolute inset-0 opacity-0 cursor-ew-resize w-full h-full z-20" 
                  />
                </div>
              </div>
            </section>

            {/* Doctor Profile */}
            <section id="doctor" className="mx-auto max-w-7xl px-4 py-16 sm:px-6 lg:py-24">
              <div className="grid items-center gap-10 lg:grid-cols-2">
                <img
                  src={CLINIC_GALLERY[3].img}
                  alt="Doctor consultation lounge"
                  className="h-96 w-full rounded-[2rem] object-cover shadow-xl border-4 border-white"
                />
                <div>
                  <h2 className="font-serif text-3xl font-bold text-teal-900 sm:text-4xl">Meet {config.doctorName}</h2>
                  <p className="mt-2 font-semibold text-teal-700">{config.doctorDesignation}</p>
                  <p className="mt-4 text-slate-600 text-sm sm:text-base leading-relaxed">{config.doctorBio}</p>
                  <div className="mt-8 grid gap-4 sm:grid-cols-2">
                    <div className="rounded-2xl border border-teal-100 bg-white p-5 shadow-xs">
                      <p className="font-bold text-teal-900">Zero-Fear Dentistry</p>
                      <p className="mt-1 text-xs text-slate-600">Gentle anesthesia, clear explanations, and comfort-focused care.</p>
                    </div>
                    <div className="rounded-2xl border border-teal-100 bg-white p-5 shadow-xs">
                      <p className="font-bold text-teal-900">Precision Technology</p>
                      <p className="mt-1 text-xs text-slate-600">Digital diagnostics and guided treatment planning.</p>
                    </div>
                  </div>
                </div>
              </div>
            </section>

            {/* Contact Details */}
            <section id="contact" className="border-t border-teal-100 bg-white py-16 lg:py-24">
              <div className="mx-auto grid max-w-7xl gap-8 px-4 sm:px-6 lg:grid-cols-3">
                <div className="rounded-3xl border border-teal-100 bg-teal-50/40 p-6">
                  <span className="text-2xl">📞</span>
                  <h3 className="mt-3 font-serif text-xl font-bold text-teal-900">Call Us</h3>
                  <p className="mt-2 text-slate-600 text-sm">{config.phone}</p>
                  <a href={"tel:" + config.phone} className="mt-3 inline-block text-xs font-bold text-teal-700 hover:underline">Place a Call →</a>
                </div>
                <div className="rounded-3xl border border-teal-100 bg-teal-50/40 p-6">
                  <span className="text-2xl">📍</span>
                  <h3 className="mt-3 font-serif text-xl font-bold text-teal-900">Visit Us</h3>
                  <p className="mt-2 text-slate-600 text-sm leading-relaxed">{config.address}</p>
                  <a href="https://maps.google.com/?q=Hegganahalli+Bengaluru" target="_blank" rel="noreferrer" className="mt-3 inline-block text-xs font-bold text-teal-700 hover:underline">Get Directions →</a>
                </div>
                <div className="rounded-3xl border border-teal-100 bg-teal-50/40 p-6">
                  <span className="text-2xl">🕒</span>
                  <h3 className="mt-3 font-serif text-xl font-bold text-teal-900">Clinic Hours</h3>
                  <p className="mt-2 text-slate-600 text-sm">{config.timing}</p>
                  <p className="mt-1 text-xs text-emerald-600 font-semibold">Walk-ins & Appointments Welcome</p>
                </div>
              </div>
            </section>
          </main>

          {/* Footer */}
          <footer className="bg-teal-900 py-10 text-center text-teal-100 text-xs border-t border-teal-800">
            <p className="font-bold text-base text-white font-serif">{config.clinicName}</p>
            <p className="mt-2 max-w-md mx-auto">{config.address}</p>
            <p className="mt-2">{config.phone} • {config.timing}</p>
            <p className="mt-6 text-teal-400">© 2026 {config.clinicName}. All rights reserved.</p>
          </footer>

          {/* Appointments Bag Drawer */}
          {drawerOpen && (
            <div className="fixed inset-0 z-50 flex justify-end bg-black/50 backdrop-blur-xs" onClick={() => setDrawerOpen(false)}>
              <aside className="h-full w-full max-w-md overflow-y-auto bg-white p-6 shadow-2xl flex flex-col justify-between" onClick={(e) => e.stopPropagation()}>
                <div>
                  <div className="flex items-center justify-between pb-4 border-b border-stone-100">
                    <div>
                      <h2 className="font-serif text-xl font-bold text-teal-900">Appointment Bag</h2>
                      <p className="text-xs text-slate-500">Manage or cancel booked visits</p>
                    </div>
                    <button onClick={() => setDrawerOpen(false)} className="rounded-full p-2 text-slate-400 hover:bg-slate-100 font-bold">✕</button>
                  </div>

                  {appointments.length === 0 ? (
                    <div className="mt-12 rounded-3xl border border-dashed border-teal-200 p-8 text-center">
                      <p className="text-2xl">📅</p>
                      <p className="mt-3 font-bold text-teal-900 text-sm">No appointments selected</p>
                      <p className="mt-1 text-xs text-slate-500">Add a treatment from the treatments list to request a visit.</p>
                    </div>
                  ) : (
                    <div className="mt-6 space-y-4">
                      {appointments.map((appointment) => (
                        <div key={appointment.id} className="rounded-2xl border border-teal-100 bg-stone-50 p-4">
                          <div className="flex justify-between items-center mb-1">
                            <span className="font-bold text-teal-900 text-sm">{appointment.title}</span>
                            <span className="text-xs text-emerald-600 font-bold">● Active</span>
                          </div>
                          <p className="text-xs text-slate-500">{appointment.category} • {appointment.time}</p>
                          <p className="mt-1 text-[11px] text-slate-400">Added: {new Date(appointment.bookedAt).toLocaleDateString()}</p>
                          <button
                            onClick={() => cancelAppointment(appointment)}
                            className="mt-3 inline-flex items-center gap-1.5 rounded-full bg-rose-50 px-3.5 py-1.5 text-xs font-bold text-rose-600 hover:bg-rose-100 transition"
                          >
                            🗑 Cancel & Notify WhatsApp
                          </button>
                        </div>
                      ))}
                    </div>
                  )}
                </div>

                <div className="pt-6 border-t border-stone-100">
                  <a
                    href={whatsappLink(
                      appointments.length
                        ? "Hello " + config.clinicName + ", I would like to book these treatments: " + appointments.map((a) => a.title).join(", ") + "."
                        : "Hello " + config.clinicName + ", I would like to book a dental consultation."
                    )}
                    target="_blank"
                    rel="noreferrer"
                    className="flex items-center justify-center gap-2 rounded-full bg-teal-600 px-6 py-3.5 font-bold text-white hover:bg-teal-700 shadow-md transition text-sm"
                  >
                    💬 Confirm via WhatsApp
                  </a>
                  <p className="text-center text-[11px] text-slate-400 mt-2">
                    Canceling directly notifies {config.clinicName} via WhatsApp.
                  </p>
                </div>
              </aside>
            </div>
          )}

          {/* Gallery Lightbox */}
          {lightbox !== null && visibleGallery[lightbox] && (
            <div className="fixed inset-0 z-50 grid place-items-center bg-black/85 p-4 backdrop-blur-xs" onClick={() => setLightbox(null)}>
              <div className="relative max-h-[90vh] w-full max-w-4xl overflow-hidden rounded-3xl bg-white shadow-2xl" onClick={(e) => e.stopPropagation()}>
                <img src={visibleGallery[lightbox].img} alt={visibleGallery[lightbox].title} className="max-h-[65vh] w-full object-cover" />
                <div className="p-6">
                  <p className="text-xs font-bold uppercase tracking-wide text-teal-700">{visibleGallery[lightbox].category}</p>
                  <h3 className="mt-1 font-serif text-2xl font-bold text-teal-900">{visibleGallery[lightbox].title}</h3>
                  <p className="mt-2 text-xs sm:text-sm text-slate-600">{visibleGallery[lightbox].desc}</p>
                </div>
                <button
                  onClick={() => setLightbox((lightbox - 1 + visibleGallery.length) % visibleGallery.length)}
                  className="absolute left-3 top-1/2 -translate-y-1/2 rounded-full bg-white/90 p-2.5 font-bold shadow hover:bg-white"
                >
                  ◀
                </button>
                <button
                  onClick={() => setLightbox((lightbox + 1) % visibleGallery.length)}
                  className="absolute right-3 top-1/2 -translate-y-1/2 rounded-full bg-white/90 p-2.5 font-bold shadow hover:bg-white"
                >
                  ▶
                </button>
                <button onClick={() => setLightbox(null)} className="absolute right-4 top-4 rounded-full bg-white/90 w-8 h-8 flex items-center justify-center font-bold shadow hover:bg-white">✕</button>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
